```html
<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>ShopNest | Edit Product</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">

<style>

body{
background:#f4f6f9;
min-height:100vh;
}

.navbar-brand img{
height:36px;
}

.form-wrapper{
min-height:calc(100vh - 56px);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.form-card{
width:100%;
max-width:480px;
border-radius:12px;
box-shadow:0 10px 28px rgba(0,0,0,0.15);
overflow:hidden;
}

.card-header{
background:#0d6efd;
color:white;
text-align:center;
font-weight:600;
}

.form-control:focus{
box-shadow:none;
border-color:#0d6efd;
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary px-3 fixed-top">

<a class="navbar-brand fw-bold d-flex align-items-center gap-2"
th:href="@{/admin/admindashboard}">

<img th:src="@{/shopnest-logo.png}">
ShopNest
<span class="badge bg-warning text-dark">ADMIN</span>

</a>

</nav>


<div class="form-wrapper">

<div class="card form-card">


<div class="card-header py-3">

<h5>
<i class="bi bi-pencil-square"></i>
Edit Product
</h5>

</div>


<div class="card-body p-4">

<form th:action="@{/admin/products/update}" method="post">

<input type="hidden" name="id" th:value="${product.id}">

<!-- PRODUCT NAME -->
<div class="mb-3">

<label class="form-label fw-semibold">Product Name</label>

<input type="text"
name="name"
th:value="${product.name}"
class="form-control"
required>

</div>


<!-- PRICE -->
<div class="mb-3">

<label class="form-label fw-semibold">Price</label>

<input type="number"
step="0.01"
name="unitPrice"
th:value="${product.unitPrice}"
class="form-control"
required>

</div>


<!-- IMAGE URL -->
<div class="mb-3">

<label class="form-label fw-semibold">Image URL</label>

<input type="text"
name="imageUrl"
th:value="${product.imageUrl}"
class="form-control">

</div>


<!-- CATEGORY -->
<div class="mb-4">

<label class="form-label fw-semibold">Category</label>

<select name="category.id" class="form-select">

<option th:each="cat : ${categories}"
        th:value="${cat.id}"
        th:selected="${cat.id == product.category.id}"
        th:text="${cat.categories}">
</option>

</select>

</div>


<div class="d-grid">

<button class="btn btn-primary fw-semibold">

<i class="bi bi-check-circle-fill"></i>
Update Product

</button>

</div>

</form>

</div>


<div class="card-footer text-center bg-white border-0 pb-3">

<a th:href="@{/admin/admindashboard}"
class="text-decoration-none fw-semibold">

<i class="bi bi-arrow-left"></i>
Back to Dashboard

</a>

</div>

</div>

</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
```
