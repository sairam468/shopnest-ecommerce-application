```html
<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ShopNest | Create Account</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet" />
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet" />

<style>

body{
background:#f4f6f9;
min-height:100vh;
}

.navbar-brand img{
height:36px;
}

.form-wrapper{
min-height:calc(100vh - 56px);
display:flex;
align-items:center;
justify-content:center;
padding:20px;
}

.form-card{
width:100%;
max-width:460px;
border-radius:12px;
box-shadow:0 10px 28px rgba(0,0,0,0.15);
overflow:hidden;
}

.card-header{
background:#0d6efd;
color:white;
text-align:center;
font-weight:600;
}

.form-control:focus{
box-shadow:none;
border-color:#0d6efd;
}

.alert{
font-size:0.9rem;
}

</style>
</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-dark bg-primary px-3 fixed-top">

<a class="navbar-brand fw-bold d-flex align-items-center gap-2"
th:href="@{/}">

<img th:src="@{/shopnest-logo.png}">
ShopNest

</a>

</nav>

<div class="form-wrapper">

<div class="card form-card">

<div class="card-header py-3">

<h5>
<i class="bi bi-person-plus-fill"></i>
Create User Account
</h5>

</div>


<div class="card-body p-4">

<!-- SUCCESS -->
<div th:if="${success}" class="alert alert-success text-center">
Account created successfully! Please login.
</div>

<!-- PASSWORD ERROR -->
<div th:if="${passwordError}" class="alert alert-danger text-center">
Passwords do not match.
</div>

<!-- EMAIL EXISTS -->
<div th:if="${emailExists}" class="alert alert-danger text-center">
Email already registered.
</div>

<form th:action="@{/user/register}" method="post">

<!-- NAME -->
<div class="mb-3">

<label class="form-label fw-semibold">Full Name</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-person-fill"></i>
</span>

<input type="text"
name="fullName"
class="form-control"
placeholder="Enter your full name"
required>

</div>

</div>


<!-- EMAIL -->
<div class="mb-3">

<label class="form-label fw-semibold">Email</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-envelope-fill"></i>
</span>

<input type="email"
name="email"
class="form-control"
placeholder="Enter your email"
required>

</div>

</div>


<!-- PASSWORD -->
<div class="mb-3">

<label class="form-label fw-semibold">Password</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-lock-fill"></i>
</span>

<input type="password"
name="password"
class="form-control"
placeholder="Create password"
required>

</div>

</div>


<!-- CONFIRM PASSWORD -->
<div class="mb-4">

<label class="form-label fw-semibold">Confirm Password</label>

<div class="input-group">

<span class="input-group-text">
<i class="bi bi-shield-lock-fill"></i>
</span>

<input type="password"
name="confirmPassword"
class="form-control"
placeholder="Confirm password"
required>

</div>

</div>


<div class="d-grid">

<button type="submit" class="btn btn-primary fw-semibold">

<i class="bi bi-person-check-fill"></i>
Create Account

</button>

</div>

</form>

</div>


<div class="card-footer text-center bg-white border-0 pb-3">

Already have an account?
<a th:href="@{/login}" class="text-decoration-none fw-semibold">
Login
</a>

</div>

</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>
```
